<div class="product-card" [class.fade-in]="true">
  <div class="product-image">
    <img [src]="product.imageUrl" [alt]="product.name">
  </div>

  <div class="product-info">
    <h3 class="product-name">{{ product.name }}</h3>
    <span class="product-collection">{{ product.collection }}</span>
    <p class="product-description">{{ product.description }}</p>
    
    <div class="product-features">
      <span *ngFor="let feature of product.features" class="feature-tag">
        {{ feature }}
      </span>
    </div>
    
    <div class="product-footer">
      <div class="product-price-status">
        <span class="product-price">₹{{ product.price }}</span>
        <span class="stock-status" [class.in-stock]="product.inStock">
          {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
        </span>
      </div>
      <div class="quantity-controls" *ngIf="quantity > 0; else addToCartBtn">
        <button class="quantity-btn" (click)="updateQuantity(-1)">
          <i class="fas fa-minus"></i>
        </button>
        <span class="quantity">{{ quantity }}</span>
        <button class="quantity-btn" (click)="updateQuantity(1)">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <ng-template #addToCartBtn>
        <button class="btn-primary add-to-cart" (click)="addToCart()" [disabled]="!product.inStock">
          <i class="fas fa-shopping-cart"></i>
          Add to Cart
        </button>
      </ng-template>
    </div>
  </div>
</div>
