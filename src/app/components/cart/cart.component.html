<div class="cart-page">
  <div class="container">
    <h2>Shopping Cart</h2>

    <div class="cart-content" *ngIf="cartItems.length > 0; else emptyCart">
      <!-- Cart Items -->
      <div class="cart-items">
        <div class="cart-item" *ngFor="let item of cartItems">
          <div class="item-image">
            <img [src]="item.product.imageUrl" [alt]="item.product.name">
          </div>
          <div class="item-details">
            <h3>{{ item.product.name }}</h3>
            <div class="item-collection">{{ item.product.collection }}</div>
            <div class="item-price">₹{{ item.product.price }}</div>
          </div>
          <div class="item-quantity">
            <button class="quantity-btn" (click)="updateQuantity(item, -1)">
              <i class="fas fa-minus"></i>
            </button>
            <span>{{ item.quantity }}</span>
            <button class="quantity-btn" (click)="updateQuantity(item, 1)">
              <i class="fas fa-plus"></i>
            </button>
          </div>
          <div class="item-total">
            ₹{{ item.product.price * item.quantity }}
          </div>
          <button class="remove-btn" (click)="removeItem(item)">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <!-- Cart Summary -->
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>₹{{ subtotal }}</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>₹{{ shipping }}</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>₹{{ total }}</span>
        </div>
        <div class="cart-actions">
          <button class="btn-secondary" (click)="copyToClipboard()">
            <i class="fas fa-copy"></i> Copy Items
            <span class="copy-success" *ngIf="copySuccess">Copied!</span>
          </button>
          <button class="btn-secondary" (click)="clearCart()">
            <i class="fas fa-trash"></i> Clear Cart
          </button>
        </div>
      </div>
    </div>

    <!-- Empty Cart State -->
    <ng-template #emptyCart>
      <div class="cart-empty">
        <i class="fas fa-shopping-cart"></i>
        <p>Your cart is empty</p>
        <button class="btn-primary" (click)="continueShopping()">
          <i class="fas fa-arrow-left"></i> Continue Shopping
        </button>
      </div>
    </ng-template>
  </div>
</div>
